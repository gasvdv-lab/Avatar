<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091019">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>AvatarEngine v0.3.0</title>
<link rel="stylesheet" href="style.css?v=0400">

<style id="white-theme-fix">
html, body {
  background: #ffffff !important;
  color: #1d2732 !important;
}
body {
  background: #ffffff !important;
}
header, footer {
  background: #ffffff !important;
  color: #1d2732 !important;
  border-color: #d9e0e7 !important;
}
header p, footer span {
  color: #667788 !important;
}
.badge {
  background: #f7f9fb !important;
  color: #36546f !important;
  border-color: #cad5df !important;
}
.viewer {
  background: #ffffff !important;
}
#viewport, canvas {
  background: #ffffff !important;
  background-image: none !important;
}
.status {
  background: rgba(255,255,255,.96) !important;
  color: #52616f !important;
  border-color: #d6e0e8 !important;
}
button {
  background: #ffffff !important;
  color: #1d2732 !important;
  border-color: #cbd6df !important;
}
</style>

</head>
<body>
<header>
  <div>
    <h1>AvatarEngine</h1>
    <p>v0.4.0 · Future Astronaut Suit</p>
  </div>
  <span class="badge">COLONY SUIT</span>
</header>

<main>
  <section class="viewer">
    <canvas id="viewport"></canvas>
    <div class="status" id="status">HM08 basemesh laden…</div>
    <div class="controls">
      <button data-view="front">Front</button>
      <button data-view="three">3/4</button>
      <button data-view="side">Side</button>
      <button data-view="back">Back</button>
      <button data-view="reset">Reset</button>
    </div>
  </section>

  <footer>
    <strong>Astronaut Suit v0.4.0</strong>
    <span>MakeHuman HM08 · blauwe T-shirt preview · originele vertex-ID’s · klaar voor morph targets</span>
  </footer>
</main>

<script src="app.js?v=0400"></script>
</body>
</html>
