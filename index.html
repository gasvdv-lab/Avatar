<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>AvatarEngine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>AvatarEngine</h1>
      <p>v0.1.3 · Genderneutrale Base Body</p>
    </div>
    <span class="badge">SPACE COLONY</span>
  </header>

  <main>
    <section class="viewer">
      <canvas id="viewport"></canvas>

      <div class="status" id="status">3D body laden…</div>

      <div class="controls">
        <button data-view="front">Front</button>
        <button data-view="three">3/4</button>
        <button data-view="side">Side</button>
        <button data-view="back">Back</button>
        <button data-view="reset">Reset</button>
      </div>
    </section>

    <section class="panel">
      <div>
        <strong>Base body v0.1.3</strong>
        <span>Smooth semi-anime · light athletic · A-pose</span>
      </div>
      <div class="hint">Sleep om te draaien · knijp om te zoomen</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
